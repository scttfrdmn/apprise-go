name: ✨ Feature Request
description: Suggest a new feature or enhancement
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a new feature! Before submitting, please:
        - Check if this feature exists in the upstream Python Apprise
        - Search existing issues to avoid duplicates
        - Consider if this is Go-specific or should apply to both versions

  - type: dropdown
    id: category
    attributes:
      label: Feature Category
      description: What type of feature is this?
      options:
        - New Notification Service
        - Core Library Enhancement
        - CLI Tool Enhancement
        - REST API Enhancement
        - Configuration/Template System
        - Attachment System
        - Performance Optimization
        - Documentation
        - Developer Experience
        - Other
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of Apprise-Go would this affect?
      options:
        - Notification Services
        - Core Library (apprise/)
        - CLI (cmd/apprise-cli)
        - REST API (cmd/apprise-api)
        - Configuration System
        - Attachment Framework
        - HTTP Client/Pooling
        - Testing/Benchmarks
        - Documentation
        - All Components
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve?
      placeholder: As a [user/developer], I need to [do something] because [reason]...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How would you like this feature to work?
      placeholder: |
        I'd like Apprise-Go to support...
        For example, add service URL: `service://token/...`
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you thought of other ways to solve this problem?
      placeholder: I also considered...

  - type: textarea
    id: example
    attributes:
      label: Usage Example
      description: Show us how this feature would be used
      placeholder: |
        // Example code
        app := apprise.New()
        app.Add("newservice://...")
        app.Notify("title", "body")
      render: go

  - type: dropdown
    id: upstream
    attributes:
      label: Upstream Status
      description: Does this feature exist in Python Apprise?
      options:
        - Exists in upstream - needs Go port
        - Upstream has similar feature
        - Go-specific feature
        - Not in upstream
        - Not applicable
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How important is this feature?
      options:
        - Critical - Blocking usage
        - High - Would significantly improve workflow
        - Medium - Nice to have
        - Low - Minor improvement
    validations:
      required: true

  - type: dropdown
    id: breaking
    attributes:
      label: Breaking Change
      description: Would this require breaking changes?
      options:
        - No breaking changes
        - Minor breaking changes (with migration path)
        - Major breaking changes
        - Not sure
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any other information, examples, or references
      placeholder: Links to upstream issue, API documentation, similar implementations, etc.
